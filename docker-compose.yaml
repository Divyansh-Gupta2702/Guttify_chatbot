services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gutgpt-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://gutgpt_user:${POSTGRES_PASSWORD}@postgres:5432/gutgpt
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
        
  postgres:
    image: postgres:16
    container_name: gutgpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gutgpt
      POSTGRES_USER: gutgpt_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gutgpt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gutgpt_user -d gutgpt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gutgpt_postgres_data:
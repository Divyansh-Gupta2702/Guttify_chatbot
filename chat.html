<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6a3f96">
  <title>GutGPT Chat</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f5f1f7;
      color: #241f2b;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .app {
      width: min(760px, 100%);
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #faf8fb;
      box-shadow: 0 0 35px #00000012;
    }

    header {
      padding: 16px 18px;
      background: linear-gradient(135deg, #c93f8f, #6a3f96);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font: 600 20px Georgia, serif;
      margin: 0;
    }

    .sub {
      font-size: 11px;
      opacity: .85;
      margin-top: 3px;
    }

    select {
      border: 1px solid #ffffff55;
      border-radius: 9px;
      background: #ffffff18;
      color: #fff;
      padding: 8px;
      outline: 0;
      cursor: pointer;
    }

    select option {
      color: #222;
      background: #fff;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 82%;
      padding: 11px 13px;
      border-radius: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .bot {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e8dfea;
      border-bottom-left-radius: 4px;
    }

    .user {
      align-self: flex-end;
      background: #6a3f96;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .error {
      background: #fff1eb;
      color: #a9552e;
      border-color: #edcdbd;
    }

    .typing {
      opacity: .65;
      font-style: italic;
    }

    .products {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 82%;
      align-self: flex-start;
    }

    .card {
      background: #fff;
      border: 1px solid #e8dfea;
      border-radius: 12px;
      padding: 11px;
    }

    .card b {
      font-size: 14px;
    }

    .card p {
      font-size: 12px;
      color: #665f70;
      margin: 5px 0;
    }

    .card a {
      font-size: 12px;
      color: #a82e78;
      font-weight: 600;
      text-decoration: none;
    }

    .card a:hover {
      text-decoration: underline;
    }

    .status {
      min-height: 18px;
      padding: 0 16px 7px;
      color: #706979;
      font-size: 11px;
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #fff;
      border-top: 1px solid #e8dfea;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      border: 1px solid #ded3e4;
      border-radius: 24px;
      padding: 12px 14px;
      font: inherit;
      outline: 0;
    }

    .composer input:focus {
      border-color: #6a3f96;
      box-shadow: 0 0 0 3px #6a3f9618;
    }

    .composer button {
      width: 46px;
      min-width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: #6a3f96;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .composer button:hover:not(:disabled) {
      filter: brightness(.95);
    }

    .composer button:disabled,
    .composer input:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .app {
        width: 100%;
      }

      .msg,
      .products {
        max-width: 90%;
      }

      header {
        padding: 13px 14px;
      }

      #messages {
        padding: 14px;
      }

      .sub {
        max-width: 220px;
      }
    }
  </style>

</head>

<header>
  <div>

    <option value="pa">ਪੰਜਾਬੀ</option>
    <option value="or">ଓଡ଼ିଆ</option>
  </select>
</header>

<main id="messages" aria-live="polite" aria-label="GutGPT conversation"></main>

<div class="status" id="status" aria-live="polite"></div>

<form class="composer" id="form" autocomplete="off">
  <input
    id="input"
    type="text"
    maxlength="4000"
    placeholder="Tell me what you're experiencing…"
    autocomplete="off"
    required
    aria-label="Message"
  >
  <button id="send" type="submit" aria-label="Send message">✓</button>
</form>
```

      function currentLabels() {
        return labels[language.value] || labels.en;
      }

      function updateLanguageUI() {
        const l = currentLabels();

        input.placeholder = l.placeholder;

        document.documentElement.lang = language.value;

        if (!busy && !sessionId) {
          status.textContent = "";
        }
      }

      function addMessage(text, who = "bot", cls = "") {
        const element = document.createElement("div");

        element.className =
          `msg ${who}${cls ? " " + cls : ""}`;

        element.textContent =
          typeof text === "string" ? text : String(text ?? "");

        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;

        return element;
      }

      function addProducts(items) {
        if (!Array.isArray(items) || items.length === 0) {
          return;
        }

        const wrapper = document.createElement("div");
        wrapper.className = "products";

        items.forEach(product => {
          if (!product || typeof product !== "object") {
            return;
          }

          const card = document.createElement("div");
          card.className = "card";

          const name = document.createElement("b");
          name.textContent =
            product.product_name || "Guttify product";

          card.appendChild(name);

          const support = Array.isArray(product.intended_support)
            ? product.intended_support[0]
            : product.intended_support;

          if (support) {
            const description = document.createElement("p");
            description.textContent = String(support);
            card.appendChild(description);
          }

          const url =
            typeof product.product_url === "string"
              ? product.product_url
              : typeof product.url === "string"
                ? product.url
                : "";

          if (/^https?:\/\//i.test(url)) {
            try {
              const parsed = new URL(url);

              if (
                parsed.protocol === "http:" ||
                parsed.protocol === "https:"
              ) {
                const link = document.createElement("a");
                link.href = parsed.href;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "View Product";
                card.appendChild(link);
              }
            } catch {
              // Ignore invalid product URLs.
            }
          }

          wrapper.appendChild(card);
        });

        if (wrapper.children.length > 0) {
          messages.appendChild(wrapper);
          messages.scrollTop = messages.scrollHeight;
        }
      }

      async function request(path, options = {}) {
        const response = await fetch(API + path, {
          ...options,
          headers: {
            Accept: "application/json",
            ...(options.headers || {})
          }
        });

        let data = null;

        try {
          data = await response.json();
        } catch {
          // Response wasn't JSON.
        }

        if (!response.ok) {
          const message =
            data && typeof data.error === "string"
              ? data.error
              : `HTTP ${response.status}`;

          throw new Error(message);
        }

        return data;
      }

      function setBusy(value) {
        busy = value;
        input.disabled = value || ended;
        send.disabled = value || ended;
        language.disabled = value;
      }

      async function newSession() {
        if (busy) {
          return;
        }

        setBusy(true);

        status.textContent = currentLabels().starting;

        try {
          const data = await request("/api/session", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              language: language.value
            })
          });

          if (!data || !data.session_id) {
            throw new Error("Invalid session response");
          }

          sessionId = String(data.session_id);
          ended = false;

          messages.innerHTML = "";

          addMessage(currentLabels().hello, "bot");

          status.textContent = "";

          input.focus();

        } catch (error) {
          sessionId = null;
          ended = false;

          status.textContent = "";

          addMessage(
            currentLabels().connection,
            "bot",
            "error"
          );

        } finally {
          setBusy(false);
          input.focus();
        }
      }

      async function sendMessage() {
        if (busy || ended || !sessionId) {
          return;
        }

        const text = input.value.trim();

        if (!text) {
          return;
        }

        addMessage(text, "user");

        input.value = "";

        setBusy(true);

        const typing = addMessage(
          currentLabels().thinking,
          "bot",
          "typing"
        );

        try {
          const data = await request("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              session_id: sessionId,
              message: text,
              language: language.value
            })
          });

          typing.remove();

          const reply =
            data && typeof data.reply === "string"
              ? data.reply
              : "I wasn't able to generate a response.";

          const isSafetyReview =
            data && data.status === "SAFETY_REVIEW";

          addMessage(
            reply,
            "bot",
            isSafetyReview ? "error" : ""
          );

          addProducts(data?.recommendations);

          if (data?.status === "SESSION_ENDED") {
            ended = true;
            status.textContent = currentLabels().ended;
          }

        } catch (error) {
          typing.remove();

          addMessage(
            currentLabels().error,
            "bot",
            "error"
          );

          console.error("GutGPT request failed:", error);

        } finally {
          setBusy(false);

          if (!ended) {
            input.focus();
          }
        }
      }

      language.addEventListener("change", async () => {
        updateLanguageUI();

        /*
         * Start a fresh assessment when the language changes.
         * This prevents messages from different-language sessions
         * being mixed together.
         */
        if (sessionId) {
          sessionId = null;
          ended = false;
          messages.innerHTML = "";
          await newSession();
        }
      });

      form.addEventListener("submit", event => {
        event.preventDefault();
        sendMessage();
      });

      /*
       * Allow Enter to send while still allowing Shift+Enter
       * to create a newline if the input is later changed to textarea.
       */
      input.addEventListener("keydown", event => {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();

          if (!busy && !ended) {
            form.requestSubmit();
          }
        }
      });

      updateLanguageUI();
      newSession();

    })();
  </script>

</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guttify — Gut Health Assistant</title>
<link rel="icon" type="image/png" href="/static/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
  <div id="app">
    <header id="app-header">
      <img class="mark" src="/static/logo.png?v=2" alt="Guttify logo" width="44" height="44">
      <div>
        <h1>Guttify</h1>
        <p>Gut health product assistant</p>
      </div>
    </header>

    <main id="messages" aria-live="polite"></main>

    <form id="chat-form" autocomplete="off">
      <input
        id="chat-input"
        type="text"
        placeholder="Tell me what you're experiencing…"
        required
        aria-label="Describe what you're experiencing"
      >
      <button type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M4 12h15m0 0-6-6m6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
    <p id="disclaimer">Guttify is a wellness assistant, not a medical provider. It doesn't diagnose conditions.</p>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>

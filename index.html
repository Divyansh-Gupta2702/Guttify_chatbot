<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GutGPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #f7f3f8;
      color: #241f2b;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: min(760px, 100%);
      height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(60, 30, 70, 0.12);
    }

    header {
      padding: 18px 20px;
      background: linear-gradient(135deg, #c93f8f, #6a3f96);
      color: #fff;
    }

    header h1 {
      margin: 0;
      font: 600 23px Georgia, serif;
    }

    header p {
      margin: 4px 0 0;
      font-size: 12px;
      opacity: 0.9;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #faf8fb;
    }

    .msg {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .bot {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #eadfee;
      border-bottom-left-radius: 4px;
    }

    .user {
      align-self: flex-end;
      background: #6a3f96;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .error {
      background: #fff3ed;
      color: #a9552e;
      border-color: #e8cdb8;
    }

    .thinking {
      color: #766e7d;
      font-style: italic;
    }

    .products {
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-width: 82%;
      align-self: flex-start;
    }

    .product {
      padding: 12px;
      background: #fff;
      border: 1px solid #e5dbea;
      border-radius: 12px;
    }

    .product strong {
      display: block;
      margin-bottom: 4px;
    }

    .product small {
      display: block;
      color: #665f70;
      margin-bottom: 7px;
    }

    .product a {
      color: #a82e78;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }

    .product a:hover {
      text-decoration: underline;
    }

    .status {
      min-height: 18px;
      padding: 0 18px 7px;
      color: #766e7d;
      font-size: 11px;
    }

    form {
      display: flex;
      gap: 9px;
      padding: 12px;
      border-top: 1px solid #eee5f0;
      background: #fff;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid #ddd1e3;
      border-radius: 999px;
      padding: 12px 15px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #6a3f96;
      box-shadow: 0 0 0 3px rgba(106, 63, 150, 0.1);
    }

    button {
      border: 0;
      border-radius: 999px;
      background: #6a3f96;
      color: #fff;
      padding: 0 20px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #593382;
    }

    button:disabled,
    input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .app {
        height: 100dvh;
      }

      .messages {
        padding: 14px;
      }

      .msg,
      .products {
        max-width: 90%;
      }

      form {
        padding: 10px;
      }

      button {
        padding: 0 16px;
      }
    }
  </style>

</head>

<body>
  <div class="app">
    <header>
      <h1>GutGPT</h1>
      <p>Guttify's gut-health assessment assistant</p>
    </header>

<form id="form">
  <input
    id="input"
    type="text"
    maxlength="4000"
    autocomplete="off"

  </div>

  <script>
    (() => {
      const messages = document.getElementById("messages");
      const status = document.getElementById("status");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const form = document.getElementById("form");

      let sessionId = crypto.randomUUID();
      let busy = false;
      let ended = false;

      function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
      }

      function addMessage(text, who = "bot", extra = "") {
        const element = document.createElement("div");

        element.className = `msg ${who} ${extra}`.trim();
        element.textContent = text;

        messages.appendChild(element);
        scrollToBottom();

        return element;
      }

      function addProducts(items) {
        if (!Array.isArray(items) || items.length === 0) {
          return;
        }

        const wrapper = document.createElement("div");
        wrapper.className = "products";

        items.forEach((product) => {
          if (!product || typeof product !== "object") {
            return;
          }

          const card = document.createElement("div");
          card.className = "product";

          const name = document.createElement("strong");
          name.textContent =
            product.product_name || "Guttify product";

          const description = document.createElement("small");

          const support = Array.isArray(product.intended_support)
            ? product.intended_support[0]
            : "";

          description.textContent = support || "";

          card.appendChild(name);
          card.appendChild(description);

          const url = product.product_url || product.url;

          if (
            typeof url === "string" &&
            /^https?:\/\//i.test(url)
          ) {
            const link = document.createElement("a");

            link.href = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "View Product";

            card.appendChild(link);
          }

          wrapper.appendChild(card);
        });

        if (wrapper.children.length > 0) {
          messages.appendChild(wrapper);
          scrollToBottom();
        }
      }

      async function api(path, options = {}) {
        const response = await fetch(path, options);

        let data = null;

        try {
          data = await response.json();
        } catch {
          // Response wasn't JSON.
        }

        if (!response.ok) {
          throw new Error(
            data?.detail ||
            data?.message ||
            `HTTP ${response.status}`
          );
        }

        return data;
      }

      function setBusy(value) {
        busy = value;
        input.disabled = value || ended;
        send.disabled = value || ended;
      }

      function endSession() {
        ended = true;
        input.disabled = true;
        send.disabled = true;
        status.textContent = "Session ended.";
      }

      async function init() {
        addMessage(
          "Hi! I'm GutGPT, Guttify's gut-health assessment assistant. Tell me what you're experiencing."
        );

        status.textContent = "";
        input.focus();
      }

      async function sendMessage() {
        if (busy || ended || !sessionId) {
          return;
        }

        const message = input.value.trim();

        if (!message) {
          return;
        }

        addMessage(message, "user");

        input.value = "";
        setBusy(true);

        const thinking = addMessage(
          "Thinking…",
          "bot",
          "thinking"
        );

        try {
          const data = await api("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              session_id: sessionId,
              message: message
            })
          });

          thinking.remove();

          addMessage(
            data?.reply || "No response received."
          );

          addProducts(data?.recommendations);

          if (data?.status === "SESSION_ENDED") {
            endSession();
          }
        } catch (error) {
          console.error("GutGPT API error:", error);

          thinking.remove();

          addMessage(
            `Something went wrong: ${
              error?.message || "Unable to contact the server."
            }`,
            "bot",
            "error"
          );
        } finally {
          if (!ended) {
            setBusy(false);
            input.focus();
          }
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage();
      });

      init();
    })();
  </script>

</body>
</html>

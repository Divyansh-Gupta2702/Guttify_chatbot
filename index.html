<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GutGPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f3f8;
      color: #241f2b;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: min(760px, 100%);
      height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(60, 30, 70, 0.12);
    }

    header {
      padding: 18px 20px;
      background: linear-gradient(135deg, #c93f8f, #6a3f96);
      color: #fff;
    }

    header .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font: 600 23px Georgia, serif;
    }

    header p {
      margin: 4px 0 0;
      font-size: 12px;
      opacity: 0.9;
    }

    select {
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 9px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font: inherit;
      max-width: 145px;
    }

    select option {
      color: #241f2b;
      background: #fff;
    }

    .messages {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #faf8fb;
    }

    .bristol-stool-chart {
      display: block;
      width: 100%;
      max-width: 760px;
      height: auto;
      margin: 8px 0 12px;
      border-radius: 8px;
      background: #fff;
    }

    .bristol-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 4px 0 12px;
    }
    .bristol-options button {
      border: 1px solid #8b65a7;
      border-radius: 8px;
      background: #f7f0fc;
      color: #42245b;
      padding: 7px 10px;
      font: inherit;
      cursor: pointer;
    }
    .bristol-options button:disabled { opacity: .5; cursor: not-allowed; }

    .msg {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .bot {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #eadfee;
      border-bottom-left-radius: 4px;
    }

    .user {
      align-self: flex-end;
      background: #6a3f96;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .error {
      background: #fff3ed;
      color: #a9552e;
      border-color: #e8cdb8;
    }

    .thinking {
      color: #766e7d;
      font-style: italic;
    }

    .products {
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-width: 82%;
    }

    .product {
      padding: 12px;
      background: #fff;
      border: 1px solid #e5dbea;
      border-radius: 12px;
    }

    .product strong {
      display: block;
      margin-bottom: 4px;
    }

    .product small {
      display: block;
      color: #665f70;
      margin-bottom: 7px;
    }

    .product a {
      color: #a82e78;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }

    .status {
      min-height: 18px;
      padding: 0 18px 7px;
      color: #766e7d;
      font-size: 11px;
    }

    form {
      display: flex;
      gap: 9px;
      padding: 12px;
      border-top: 1px solid #eee5f0;
      background: #fff;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid #ddd1e3;
      border-radius: 999px;
      padding: 12px 15px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #6a3f96;
      box-shadow: 0 0 0 3px rgba(106, 63, 150, 0.1);
    }

    button {
      border: 0;
      border-radius: 999px;
      background: #6a3f96;
      color: #fff;
      padding: 0 20px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled,
    input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .app {
        height: 100dvh;
      }

      .messages {
        padding: 14px;
      }

      .msg,
      .products {
        max-width: 90%;
      }
    }

    [hidden] { display: none !important; }
    .customer-intake { padding: 22px; overflow-y: auto; background: #fff; border-bottom: 1px solid #eee5f1; }
    .intake-title { margin: 0 0 6px; font-size: 20px; color: #34243f; }
    .intake-copy { margin: 0 0 18px; color: #655d6b; font-size: 13px; line-height: 1.5; }
    .intake-form { display: grid; gap: 13px; }
    .intake-form label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: #342b3b; }
    .intake-form input:not([type="checkbox"]) { width: 100%; min-height: 44px; border: 1px solid #ded5e4; border-radius: 9px; padding: 10px 12px; font: inherit; color: #241f2b; background: #fff; }
    .intake-form input:focus { outline: 2px solid #a77af0; outline-offset: 1px; }
    .intake-consent { display: flex !important; grid-template-columns: 18px 1fr; align-items: start; gap: 9px !important; font-weight: 400 !important; line-height: 1.45; }
    .intake-consent input { margin: 3px 0 0; width: 16px; height: 16px; }
    .intake-submit { min-height: 45px; border: 0; border-radius: 10px; color: #fff; font: 600 14px inherit; background: linear-gradient(135deg, #8134ed, #6020cf); cursor: pointer; }
    .intake-submit:disabled { opacity: .6; cursor: wait; }
    .intake-error { margin: 0; color: #a51d36; font-size: 13px; }
    .intake-note { margin: 0; color: #746b7b; font-size: 11px; line-height: 1.4; }

  </style>
</head>

<body>
  <div class="app">

    <header>
      <div class="top">
        <div>
          <h1>GutGPT</h1>
          <p>Guttify's gut-health assessment assistant</p>
        </div>
      </div>
    </header>

    <section id="customer-intake" class="customer-intake" aria-label="Customer registration">
      <h2 class="intake-title">Before we begin</h2>
      <p class="intake-copy">Please share a few details so GutGPT can start your gut-health assessment.</p>
      <form id="intake-form" class="intake-form" autocomplete="on">
        <label>Full name
          <input name="name" type="text" maxlength="100" autocomplete="name" required placeholder="Your name">
        </label>
        <label>Age
          <input name="age" type="number" min="1" max="120" inputmode="numeric" required placeholder="Your age">
        </label>
        <label>Contact number
          <input name="contact" type="text" inputmode="numeric" pattern="[0-9]{7,15}" minlength="7" maxlength="15" autocomplete="tel" required placeholder="Digits only (7–15 digits)">
        </label>
        <label>Location
          <input name="city" type="text" maxlength="100" autocomplete="address-level2" required placeholder="Your location">
        </label>
        <label class="intake-consent">
          <input name="consent" type="checkbox" required>
          <span>I agree to have these details stored to support this assessment.</span>
        </label>
        <p id="intake-error" class="intake-error" role="alert" hidden></p>
        <button id="intake-submit" class="intake-submit" type="submit">Save details and continue</button>
        <p class="intake-note">Your details are used to support this assessment. Avoid entering information you do not want stored.</p>
      </form>
    </section>

    <main id="messages" class="messages" aria-live="polite" hidden></main>

    <div id="status" class="status"></div>

    <form id="form" hidden>
      <input
        id="input"
        maxlength="4000"
        autocomplete="off"
        placeholder="Tell me what you're experiencing…"
        required
      >
      <button id="send" type="submit">Send</button>
    </form>

  </div>

  <script>
    (() => {
      const messages = document.getElementById("messages");
      const status = document.getElementById("status");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const form = document.getElementById("form");
      const intake = document.getElementById("customer-intake");
      const intakeForm = document.getElementById("intake-form");
      const intakeSubmit = document.getElementById("intake-submit");
      const intakeError = document.getElementById("intake-error");

      let sessionId = null;
      let customerRegistered = false;
      let busy = false;
      let ended = false;
      const GUEST_TOKEN_STORAGE_KEY = "gutgpt_guest_token_v1";
      const LEGACY_CUSTOMER_STORAGE_KEY = "gutgpt_customer_id_v1";

      function getStoredGuestToken() {
        try { return window.localStorage.getItem(GUEST_TOKEN_STORAGE_KEY) || ""; }
        catch { return ""; }
      }

      function storeGuestToken(token) {
        if (typeof token !== "string" || !token) return false;
        try {
          window.localStorage.setItem(GUEST_TOKEN_STORAGE_KEY, token);
          // The legacy customer ID is not an authentication credential.
          window.localStorage.removeItem(LEGACY_CUSTOMER_STORAGE_KEY);
          return window.localStorage.getItem(GUEST_TOKEN_STORAGE_KEY) === token;
        } catch {
          return false;
        }
      }

      async function restoreRegisteredCustomer() {
        const guestToken = getStoredGuestToken();
        if (!guestToken || !sessionId) return false;
        try {
          const data = await api("/api/customer/restore", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: sessionId, guest_token: guestToken })
          });
          if (!data || data.status !== "RESTORED") return false;
          if (typeof data.guest_token === "string" && data.guest_token) storeGuestToken(data.guest_token);
          customerRegistered = true;
          intake.hidden = true;
          messages.hidden = false;
          form.hidden = false;
          add("Welcome back " + String(data.customer?.name || data.name || "there").replace(/[<>]/g, "") + "! You can start a new gut-health assessment.");
          status.textContent = "";
          return true;
        } catch (error) {
          // Never use a customer ID as a substitute for an authentication token.
          if (String(error.message || "").includes("GUEST_SESSION_INVALID") || String(error.message || "").includes("HTTP 401")) {
            try { window.localStorage.removeItem(GUEST_TOKEN_STORAGE_KEY); } catch {}
          } else {
            console.warn("Could not restore saved customer profile", error);
          }
          return false;
        }
      }

      function add(text, who = "bot", extra = "") {
        const element = document.createElement("div");
        element.className = `msg ${who} ${extra}`;

        // The deterministic questionnaire inserts this marker immediately
        // before the Bristol stool-type question. Render the supplied chart
        // as an image in the browser frontend, without interpreting arbitrary
        // backend text as HTML.
        const chartMarker = "[[BRISTOL_STOOL_CHART]]";
        if (who === "bot" && String(text).includes(chartMarker)) {
          const parts = String(text).split(chartMarker, 2);
          const image = document.createElement("img");
          image.className = "bristol-stool-chart";
          image.src = "/bristol-stool-chart.png";
          image.alt = "Bristol Stool Chart showing stool types 1 through 7";
          image.loading = "eager";
          element.appendChild(image);
          const options = document.createElement("div");
          options.className = "bristol-options";
          options.setAttribute("aria-label", "Choose your Bristol stool type");
          for (let type = 1; type <= 7; type += 1) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = `Type ${type}`;
            button.setAttribute("aria-label", `Select Bristol stool type ${type}`);
            button.addEventListener("click", () => {
              if (busy || ended) return;
              input.value = `Bristol type ${type}`;
              void sendMessage();
            });
            options.appendChild(button);
          }
          element.appendChild(options);
          const explanation = document.createElement("div");
          explanation.textContent = (parts[1] || "").replace(/^\n/, "");
          element.appendChild(explanation);
        } else {
          element.textContent = text;
        }

        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;
        return element;
      }

      function products(items) {
        if (!Array.isArray(items) || !items.length) {
          return;
        }

        const wrap = document.createElement("div");
        wrap.className = "products";

        items.forEach((product) => {
          const element = document.createElement("div");
          element.className = "product";

          const name = document.createElement("strong");
          name.textContent = product.product_name || "Guttify product";

          const description = document.createElement("small");

          const support = Array.isArray(product.intended_support)
            ? product.intended_support[0]
            : "";

          description.textContent = support || "";

          element.appendChild(name);
          element.appendChild(description);

          const url = product.product_url || product.url;

          if (
            typeof url === "string" &&
            /^https?:\/\//i.test(url)
          ) {
            const link = document.createElement("a");

            link.href = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "View Product";

            element.appendChild(link);
          }

          wrap.appendChild(element);
        });

        messages.appendChild(wrap);
        messages.scrollTop = messages.scrollHeight;
      }

      async function api(path, options = {}) {
        const response = await fetch(path, options);

        let data = null;

        try {
          data = await response.json();
        } catch {
          // Response was not JSON.
        }

        if (!response.ok) {
          throw new Error(
            data?.detail || `HTTP ${response.status}`
          );
        }

        return data;
      }

      async function initSession() {
        sessionId = null;
        try {
          const data = await api("/api/session", { method: "POST" });
          if (!data || typeof data.session_id !== "string" || !data.session_id) {
            throw new Error("Invalid session response");
          }
          sessionId = data.session_id;
          status.textContent = "";
          const restored = await restoreRegisteredCustomer();
          if (!restored) {
            intake.hidden = false;
            messages.hidden = true;
            form.hidden = true;
          }
        } catch (error) {
          console.error("Session initialization failed", error);
          add("I couldn't connect to GutGPT right now. Please refresh and try again.", "bot", "error");
          status.textContent = "Connection unavailable";
        }
      }

      function initWelcome() {
        add("Hi! I'm GutGPT, Guttify's gut-health assessment assistant. Tell me what you're experiencing.");

        status.textContent = "";
        input.focus();
      }

      async function sendMessage() {
        if (busy || ended || !sessionId || !customerRegistered) {
          return;
        }

        const message = input.value.trim();

        if (!message) {
          return;
        }

        add(message, "user");

        input.value = "";

        busy = true;
        input.disabled = true;
        send.disabled = true;

        const thinking = add(
          "Thinking…",
          "bot",
          "thinking"
        );

        try {
          const data = await api("/api/chat", {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              session_id: sessionId,
              message: message,
            })
          });

          thinking.remove();

          add(
            data.reply || "No response received."
          );

          products(data.recommendations);

          if (data.status === "SESSION_ENDED") {
            ended = true;
            status.textContent = "Session ended.";
          }

        } catch (error) {
          console.error(error);

          thinking.remove();

          if (String(error.message || "").includes("SESSION_EXPIRED") || String(error.message || "").includes("HTTP 410")) {
            add("Your chat session expired. Starting a new session…", "bot", "error");
            ended = false;
            await initSession();
          } else {
            add(
              `Something went wrong: ${error.message}`,
              "bot",
              "error"
            );
          }

        } finally {
          busy = false;

          input.disabled = ended;
          send.disabled = ended;

          if (!ended) {
            input.focus();
          }
        }
      }

      const contactInput = intakeForm.querySelector('input[name="contact"]');
      contactInput.addEventListener("input", () => { contactInput.value = contactInput.value.replace(/[^0-9]/g, "").slice(0, 15); });

      intakeForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (busy || customerRegistered || !sessionId) return;
        const values = new FormData(intakeForm);
        const customer = {
          session_id: sessionId,
          name: String(values.get("name") || "").trim(),
          age: Number(values.get("age")),
          contact: String(values.get("contact") || "").trim(),
          city: String(values.get("city") || "").trim(),
          consent: values.get("consent") === "on"
        };
        if (!customer.name || !Number.isInteger(customer.age) || customer.age < 1 || customer.age > 120 || !/^[0-9]{7,15}$/.test(customer.contact) || !customer.city || !customer.consent) {
          intakeError.textContent = "Please complete every field and agree to the storage notice.";
          intakeError.hidden = false;
          return;
        }
        busy = true;
        intakeSubmit.disabled = true;
        intakeSubmit.textContent = "Saving details…";
        intakeError.hidden = true;
        status.textContent = "Saving your details…";
        try {
          const data = await api("/api/customer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(customer)
          });
          if (!data || data.status !== "REGISTERED" || typeof data.guest_token !== "string" || !data.guest_token) {
            throw new Error("Registration succeeded without a guest-session token. Please contact support.");
          }
          if (!storeGuestToken(data.guest_token)) {
            throw new Error("Your details were saved, but this browser could not save the secure session. Please enable site storage and refresh.");
          }
          customerRegistered = true;
          intake.hidden = true;
          messages.hidden = false;
          form.hidden = false;
          add("Hi " + customer.name.replace(/[<>]/g, "") + "! I'm GutGPT, Guttify's gut-health assessment assistant. Tell me what you're experiencing.");
          status.textContent = "";
          input.focus();
        } catch (error) {
          intakeError.textContent = error.message || "Unable to save your details. Please try again.";
          intakeError.hidden = false;
          status.textContent = "Registration not completed";
        } finally {
          busy = false;
          intakeSubmit.disabled = false;
          intakeSubmit.textContent = "Save details and continue";
        }
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage();
      });

      void initSession();
    })();
  </script>
</body>
</html>

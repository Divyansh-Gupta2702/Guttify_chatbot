<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GutGPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f3f8;
      color: #241f2b;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: min(760px, 100%);
      height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 35px rgba(60, 30, 70, 0.12);
    }

    header {
      padding: 18px 20px;
      background: linear-gradient(135deg, #c93f8f, #6a3f96);
      color: #fff;
    }

    header .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font: 600 23px Georgia, serif;
    }

    header p {
      margin: 4px 0 0;
      font-size: 12px;
      opacity: 0.9;
    }

    select {
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 9px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font: inherit;
      max-width: 145px;
    }

    select option {
      color: #241f2b;
      background: #fff;
    }

    .messages {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #faf8fb;
    }

    .msg {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .bot {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #eadfee;
      border-bottom-left-radius: 4px;
    }

    .user {
      align-self: flex-end;
      background: #6a3f96;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .error {
      background: #fff3ed;
      color: #a9552e;
      border-color: #e8cdb8;
    }

    .thinking {
      color: #766e7d;
      font-style: italic;
    }

    .products {
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-width: 82%;
    }

    .product {
      padding: 12px;
      background: #fff;
      border: 1px solid #e5dbea;
      border-radius: 12px;
    }

    .product strong {
      display: block;
      margin-bottom: 4px;
    }

    .product small {
      display: block;
      color: #665f70;
      margin-bottom: 7px;
    }

    .product a {
      color: #a82e78;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }

    .status {
      min-height: 18px;
      padding: 0 18px 7px;
      color: #766e7d;
      font-size: 11px;
    }

    form {
      display: flex;
      gap: 9px;
      padding: 12px;
      border-top: 1px solid #eee5f0;
      background: #fff;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid #ddd1e3;
      border-radius: 999px;
      padding: 12px 15px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #6a3f96;
      box-shadow: 0 0 0 3px rgba(106, 63, 150, 0.1);
    }

    button {
      border: 0;
      border-radius: 999px;
      background: #6a3f96;
      color: #fff;
      padding: 0 20px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled,
    input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .app {
        height: 100dvh;
      }

      .messages {
        padding: 14px;
      }

      .msg,
      .products {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      <div class="top">
        <div>
          <h1>GutGPT</h1>
          <p>Guttify's gut-health assessment assistant</p>
        </div>

        <select id="language" aria-label="Language">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="bn">বাংলা</option>
          <option value="mr">मराठी</option>
          <option value="ta">தமிழ்</option>
          <option value="te">తెలుగు</option>
          <option value="gu">ગુજરાતી</option>
          <option value="kn">ಕನ್ನಡ</option>
          <option value="ml">മലയാളം</option>
          <option value="pa">ਪੰਜਾਬੀ</option>
          <option value="or">ଓଡ଼ିଆ</option>
        </select>
      </div>
    </header>

    <main id="messages" class="messages"></main>

    <div id="status" class="status"></div>

    <form id="form">
      <input
        id="input"
        maxlength="4000"
        autocomplete="off"
        placeholder="Tell me what you're experiencing…"
        required
      >
      <button id="send" type="submit">Send</button>
    </form>

  </div>

  <script>
    (() => {
      const messages = document.getElementById("messages");
      const status = document.getElementById("status");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const form = document.getElementById("form");
      const language = document.getElementById("language");

      let sessionId = crypto.randomUUID();
      let busy = false;
      let ended = false;

      function add(text, who = "bot", extra = "") {
        const element = document.createElement("div");

        element.className = `msg ${who} ${extra}`;
        element.textContent = text;

        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;

        return element;
      }

      function products(items) {
        if (!Array.isArray(items) || !items.length) {
          return;
        }

        const wrap = document.createElement("div");
        wrap.className = "products";

        items.forEach((product) => {
          const element = document.createElement("div");
          element.className = "product";

          const name = document.createElement("strong");
          name.textContent = product.product_name || "Guttify product";

          const description = document.createElement("small");

          const support = Array.isArray(product.intended_support)
            ? product.intended_support[0]
            : "";

          description.textContent = support || "";

          element.appendChild(name);
          element.appendChild(description);

          const url = product.product_url || product.url;

          if (
            typeof url === "string" &&
            /^https?:\/\//i.test(url)
          ) {
            const link = document.createElement("a");

            link.href = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "View Product";

            element.appendChild(link);
          }

          wrap.appendChild(element);
        });

        messages.appendChild(wrap);
        messages.scrollTop = messages.scrollHeight;
      }

      async function api(path, options = {}) {
        const response = await fetch(path, options);

        let data = null;

        try {
          data = await response.json();
        } catch {
          // Response was not JSON.
        }

        if (!response.ok) {
          throw new Error(
            data?.detail || `HTTP ${response.status}`
          );
        }

        return data;
      }

      function init() {
        const welcome = {
          en: "Hi! I'm GutGPT, Guttify's gut-health assessment assistant. Tell me what you're experiencing.",

          hi: "नमस्ते! मैं GutGPT हूँ। मुझे बताइए कि आपको क्या परेशानी हो रही है।",
          
          bn: "হ্যালো! আমি GutGPT। আপনার কী সমস্যা হচ্ছে তা আমাকে বলুন।",

          mr: "नमस्कार! मी GutGPT आहे. तुम्हाला काय त्रास होत आहे ते मला सांगा.",

          ta: "வணக்கம்! நான் GutGPT. உங்களுக்கு என்ன பிரச்சனை உள்ளது என்பதைச் சொல்லுங்கள்.",

          te: "హలో! నేను GutGPT. మీకు ఏమి సమస్యగా అనిపిస్తుందో చెప్పండి.",

          gu: "નમસ્તે! હું GutGPT છું. તમને શું તકલીફ થઈ રહી છે તે મને જણાવો.",

          kn: "ನಮಸ್ಕಾರ! ನಾನು GutGPT. ನಿಮಗೆ ಏನು ತೊಂದರೆಯಾಗುತ್ತಿದೆ ಎಂದು ನನಗೆ ತಿಳಿಸಿ.",

          ml: "ഹലോ! ഞാൻ GutGPT ആണ്. നിങ്ങൾക്ക് എന്താണ് ബുദ്ധിമുട്ടെന്ന് പറയൂ.",

          pa: "ਸਤ ਸ੍ਰੀ ਅਕਾਲ! ਮੈਂ GutGPT ਹਾਂ। ਤੁਹਾਨੂੰ ਕੀ ਸਮੱਸਿਆ ਆ ਰਹੀ ਹੈ, ਮੈਨੂੰ ਦੱਸੋ।",

          or: "ନମସ୍କାର! ମୁଁ GutGPT। ଆପଣଙ୍କୁ କଣ ସମସ୍ୟା ହେଉଛି ମୋତେ କୁହନ୍ତୁ।"
        };

        add(welcome[language.value] || welcome.en);

        status.textContent = "";
        input.focus();
      }

      async function sendMessage() {
        if (busy || ended || !sessionId) {
          return;
        }

        const message = input.value.trim();

        if (!message) {
          return;
        }

        add(message, "user");

        input.value = "";

        busy = true;
        input.disabled = true;
        send.disabled = true;

        const thinking = add(
          "Thinking…",
          "bot",
          "thinking"
        );

        try {
          const data = await api("/api/chat", {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              session_id: sessionId,
              message: message,
              language: language.value
            })
          });

          thinking.remove();

          add(
            data.reply || "No response received."
          );

          products(data.recommendations);

          if (data.status === "SESSION_ENDED") {
            ended = true;
            status.textContent = "Session ended.";
          }

        } catch (error) {
          console.error(error);

          thinking.remove();

          add(
            `Something went wrong: ${error.message}`,
            "bot",
            "error"
          );

        } finally {
          busy = false;

          input.disabled = ended;
          send.disabled = ended;

          if (!ended) {
            input.focus();
          }
        }
      }

      language.addEventListener("change", () => {
        if (busy) {
          return;
        }

        sessionId = crypto.randomUUID();
        ended = false;

        messages.innerHTML = "";
        status.textContent = "";

        input.disabled = false;
        send.disabled = false;

        init();
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage();
      });

      init();
    })();
  </script>
</body>
</html>
